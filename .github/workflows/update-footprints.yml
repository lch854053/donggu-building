name: Update Figure-Ground Footprints

on:
  workflow_dispatch:
    inputs:
      mode:
        description: VWorld collection mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - bbox
          - pnu

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe VWorld building footprint BBOX
        if: inputs.mode != 'pnu'
        continue-on-error: ${{ inputs.mode == 'auto' }}
        run: npm run probe-footprints
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}

      - name: Collect and split building footprints
        run: node scripts/collect-building-footprints.mjs --mode=${{ inputs.mode }}
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          BLD_SERVICE_KEY: ${{ secrets.BLD_SERVICE_KEY }}

      - name: Validate generated dataset
        run: node --test test/figure-ground.test.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/figure-ground
          if git diff --cached --quiet; then
            echo "No footprint changes to commit"
          else
            git commit -m "chore: update Figure-Ground building footprints"
            git push
          fi
